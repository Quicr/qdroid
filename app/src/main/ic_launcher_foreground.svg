<svg width="108" height="108" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <!-- Android Adaptive Icon Foreground Layer -->
  <!-- Minimalist Material You design for MoQ video conferencing -->
  <!-- Size: 108dp x 108dp with content safely within 66dp safe zone -->
  <!-- All elements within 30dp radius from center (54,54) -->

  <!-- Network connection lines -->
  <g opacity="0.6">
    <!-- Lines radiating from center to nodes (8 directions) -->
    <line x1="54" y1="54" x2="32.88" y2="32.88" stroke="#FCD34D" stroke-width="1" stroke-linecap="round"/>
    <line x1="54" y1="54" x2="54" y2="24" stroke="#FCD34D" stroke-width="1" stroke-linecap="round"/>
    <line x1="54" y1="54" x2="75.12" y2="32.88" stroke="#FCD34D" stroke-width="1" stroke-linecap="round"/>

    <line x1="54" y1="54" x2="24" y2="54" stroke="#FCD34D" stroke-width="1" stroke-linecap="round"/>
    <line x1="54" y1="54" x2="84" y2="54" stroke="#FCD34D" stroke-width="1" stroke-linecap="round"/>

    <line x1="54" y1="54" x2="32.88" y2="75.12" stroke="#FCD34D" stroke-width="1" stroke-linecap="round"/>
    <line x1="54" y1="54" x2="54" y2="84" stroke="#FCD34D" stroke-width="1" stroke-linecap="round"/>
    <line x1="54" y1="54" x2="75.12" y2="75.12" stroke="#FCD34D" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Network nodes (8 points, 30dp radius from center) -->
  <g>
    <!-- Outer glow -->
    <circle cx="32.88" cy="32.88" r="3" fill="#FBBF24" opacity="0.5"/>
    <circle cx="54" cy="24" r="3" fill="#FBBF24" opacity="0.5"/>
    <circle cx="75.12" cy="32.88" r="3" fill="#FBBF24" opacity="0.5"/>
    <circle cx="24" cy="54" r="3" fill="#FBBF24" opacity="0.5"/>
    <circle cx="84" cy="54" r="3" fill="#FBBF24" opacity="0.5"/>
    <circle cx="32.88" cy="75.12" r="3" fill="#FBBF24" opacity="0.5"/>
    <circle cx="54" cy="84" r="3" fill="#FBBF24" opacity="0.5"/>
    <circle cx="75.12" cy="75.12" r="3" fill="#FBBF24" opacity="0.5"/>

    <!-- Inner bright nodes -->
    <circle cx="32.88" cy="32.88" r="2.2" fill="#FCD34D"/>
    <circle cx="54" cy="24" r="2.2" fill="#FCD34D"/>
    <circle cx="75.12" cy="32.88" r="2.2" fill="#FCD34D"/>
    <circle cx="24" cy="54" r="2.2" fill="#FCD34D"/>
    <circle cx="84" cy="54" r="2.2" fill="#FCD34D"/>
    <circle cx="32.88" cy="75.12" r="2.2" fill="#FCD34D"/>
    <circle cx="54" cy="84" r="2.2" fill="#FCD34D"/>
    <circle cx="75.12" cy="75.12" r="2.2" fill="#FCD34D"/>
  </g>

  <!-- Central broadcast/streaming icon -->
  <g transform="translate(54, 54)">

    <!-- Outer broadcast ring (representing transmission) -->
    <circle cx="0" cy="0" r="18"
            fill="none"
            stroke="#FCD34D"
            stroke-width="3"
            opacity="0.35"/>

    <!-- Middle ring -->
    <circle cx="0" cy="0" r="13"
            fill="none"
            stroke="#FCD34D"
            stroke-width="2.8"
            opacity="0.7"/>

    <!-- Video play symbol (solid triangle pointing right) -->
    <!-- Represents streaming/video content -->
    <path d="M -5,-7 L -5,7 L 8,0 Z"
          fill="#FCD34D"
          opacity="1"/>

    <!-- Small recording indicator dot (top right) -->
    <circle cx="13" cy="-13" r="3.2"
            fill="#EF4444"/>
    <circle cx="13" cy="-13" r="1.5"
            fill="#FCD34D"
            opacity="0.95"/>
  </g>

</svg>
